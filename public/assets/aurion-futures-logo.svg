<svg width="340" height="92" viewBox="0 0 340 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aurion Futures Logo</title>
  <desc id="desc">Futuristic A monogram with Aurion Futures wordmark.</desc>
  <defs>
    <linearGradient id="aurionGradient" x1="8" y1="77" x2="78" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3CFF"/>
      <stop offset="0.45" stop-color="#B829FF"/>
      <stop offset="1" stop-color="#37A8FF"/>
    </linearGradient>
    <linearGradient id="aurionGradient2" x1="36" y1="68" x2="64" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26104D"/>
      <stop offset="1" stop-color="#E7DAFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.12 0 0 0 0 1 0 0 0 0.65 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <path d="M45.5 8L8 78H25.5L45.5 40.3L65.8 78H84L45.5 8Z" fill="url(#aurionGradient)"/>
    <path d="M45.8 43.5L34.2 64.5H57.7L45.8 43.5Z" fill="#090D1C"/>
    <path d="M59.8 50.2L74.4 78H57.3L45.9 58.2L59.8 50.2Z" fill="url(#aurionGradient2)" opacity="0.95"/>
  </g>
  <g>
    <text x="104" y="43" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="4.6">AURION</text>
    <text x="107" y="69" fill="#D8D7E8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="9.6">FUTURES</text>
  </g>
</svg>
